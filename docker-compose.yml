# Local stack: postgres -> backend -> frontend.  `docker compose up --build`
# then open http://localhost:3000. Copy .env.example to .env to change the password.
name: gearloop

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: gearloop
      POSTGRES_USER: gearloop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gearloop-local-dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gearloop -d gearloop"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:5433:5432"

  backend:
    build:
      context: ./backend
      args:
        APP_VERSION: ${APP_VERSION:-compose}
    environment:
      DB_HOST: postgres
      DB_NAME: gearloop
      DB_USER: gearloop
      DB_PASSWORD: ${POSTGRES_PASSWORD:-gearloop-local-dev}
      APP_ENV: compose
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2).status == 200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        APP_VERSION: ${APP_VERSION:-compose}
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:8080"

volumes:
  pgdata:
