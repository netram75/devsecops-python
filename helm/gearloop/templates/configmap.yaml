apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "gearloop.fullname" . }}-config
  labels:
    {{- include "gearloop.labels" . | nindent 4 }}
data:
  APP_ENV: {{ .Values.config.environment | quote }}
  APP_TIMEZONE: {{ .Values.config.timezone | quote }}
  MAX_ACTIVE_LOANS: {{ .Values.config.maxActiveLoans | quote }}
  MAX_ADVANCE_DAYS: {{ .Values.config.maxAdvanceDays | quote }}
  DB_HOST: {{ include "gearloop.dbHost" . | quote }}
  DB_PORT: {{ .Values.externalDatabase.port | default 5432 | quote }}
  DB_NAME: {{ .Values.postgres.database | quote }}
  DB_USER: {{ .Values.postgres.user | quote }}
  RUN_MIGRATIONS: {{ .Values.backend.runMigrations | quote }}
