{{- if not .Values.postgres.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gearloop.secretName" . }}
  labels:
    {{- include "gearloop.labels" . | nindent 4 }}
type: Opaque
stringData:
  db-password: {{ required "set postgres.password (dev) or postgres.existingSecret" .Values.postgres.password | quote }}
{{- end }}
