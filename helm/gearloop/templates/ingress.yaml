{{- if .Values.ingress.enabled }}
{{- $fullname := include "gearloop.fullname" . -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "gearloop.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service: { name: {{ $fullname }}-backend, port: { name: http } }
          - path: /docs
            pathType: Prefix
            backend:
              service: { name: {{ $fullname }}-backend, port: { name: http } }
          # ingress-nginx rejects dots in Prefix paths, so this one is exact-ish.
          - path: /openapi.json
            pathType: ImplementationSpecific
            backend:
              service: { name: {{ $fullname }}-backend, port: { name: http } }
          - path: /
            pathType: Prefix
            backend:
              service: { name: {{ $fullname }}-frontend, port: { name: http } }
{{- end }}
