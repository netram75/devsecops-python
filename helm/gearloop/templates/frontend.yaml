{{- $fullname := include "gearloop.fullname" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-frontend
  labels:
    {{- include "gearloop.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.frontend.replicas }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "gearloop.selector" (dict "ctx" . "tier" "frontend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "gearloop.labels" . | nindent 8 }}
        app.kubernetes.io/component: frontend
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      securityContext:
        {{- include "gearloop.podSecurity" (dict "uid" 101) | nindent 8 }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "gearloop.selector" (dict "ctx" . "tier" "frontend") | nindent 14 }}
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ required "frontend.image.tag is required (use the commit SHA)" .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            # nginx proxies /api too, so a port-forward to the frontend still works.
            - name: BACKEND_URL
              value: "http://{{ $fullname }}-backend:8000"
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          securityContext:
            {{- include "gearloop.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - name: nginx-conf      # envsubst renders the template here at start
              mountPath: /etc/nginx/conf.d
            - name: tmp             # pid file and proxy buffers
              mountPath: /tmp
      volumes:
        - name: nginx-conf
          emptyDir: { sizeLimit: 1Mi }
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-frontend
  labels:
    {{- include "gearloop.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  selector:
    {{- include "gearloop.selector" (dict "ctx" . "tier" "frontend") | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
