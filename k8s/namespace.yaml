# Namespaces for GearLoop. Pod Security Admission "restricted" is enforced, so
# any pod that runs as root, escalates privileges or keeps capabilities is refused.
apiVersion: v1
kind: Namespace
metadata:
  name: gearloop
  labels:
    app.kubernetes.io/part-of: gearloop
    environment: production
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: gearloop-staging
  labels:
    app.kubernetes.io/part-of: gearloop
    environment: staging
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
